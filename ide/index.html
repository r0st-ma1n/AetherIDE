<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OurNewIDE</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e1e;
        color: #d4d4d4;
        overflow: hidden;
      }
      #root {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* Left Sidebar */
      #left-sidebar {
        width: 280px;
        min-width: 200px;
        background-color: #252526;
        border-right: 1px solid #2d2d2d;
        display: flex;
        flex-direction: column;
      }

      /* File Explorer */
      #file-explorer {
        flex: 1;
        padding: 10px;
        border-bottom: 1px solid #2d2d2d;
        overflow-y: auto;
      }
      .section-header {
        margin: 0 0 10px 0;
        font-size: 11px;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 0.8px;
      }
      .file-tree-item {
        cursor: pointer;
        padding: 4px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: none;
        font-size: 13px;
      }
      .file-tree-item:hover {
        background-color: #2a2d2e;
      }
      .folder {
        color: #dcb67a;
        font-weight: bold;
      }
      .file {
        color: #cccccc;
        padding-left: 15px;
      }

      /* Toolbox / Components */
      #toolbox {
        padding: 10px;
        flex: 0 0 auto;
        max-height: 40%;
        overflow-y: auto;
      }
      .component {
        background-color: #2a2d2e;
        padding: 8px 12px;
        margin-bottom: 6px;
        cursor: grab;
        text-align: left;
        border-radius: 4px;
        border: 1px solid #3c3c3c;
        font-size: 12px;
        display: flex;
        align-items: center;
      }
      .component:active {
        cursor: grabbing;
        background-color: #3c3c3c;
      }
      .component::before {
        content: '▤';
        margin-right: 8px;
        color: #808080;
      }

      /* Center Panel */
      #center-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background-color: #1e1e1e;
      }

      /* Tabs */
      #tabs {
        display: flex;
        background-color: #2d2d2d;
        border-bottom: 1px solid #1e1e1e;
        flex-shrink: 0;
      }
      .tab-btn {
        background: none;
        border: none;
        color: #969696;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 13px;
        outline: none;
        border-top: 2px solid transparent;
        display: flex;
        align-items: center;
      }
      .tab-btn:hover {
        background-color: #3c3c3c;
        color: #d4d4d4;
      }
      .tab-btn.active {
        color: #ffffff;
        background-color: #1e1e1e;
        border-top: 2px solid #007acc;
      }
      .close-tab-btn {
        background: none;
        border: none;
        color: #969696;
        cursor: pointer;
        padding: 0 5px;
        margin-left: 10px;
        font-size: 14px;
        line-height: 1;
      }
      .close-tab-btn:hover {
        color: #fff;
        background-color: #4a4a4a;
      }

      /* Tab Content Container */
      #tab-content {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .tab-pane {
        display: none;
        flex: 1;
        width: 100%;
        height: 100%;
      }
      .tab-pane.active {
        display: flex;
        flex-direction: column;
      }

      /* Canvas */
      #canvas {
        align-items: center;
        justify-content: center;
        background-color: #1a1a1a;
        background-image: radial-gradient(#2a2a2a 1px, transparent 0);
        background-size: 20px 20px;
      }
      #plugin-container {
        width: 600px;
        height: 400px;
        background-color: #252526;
        border: 1px solid #3c3c3c;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .dropped-component {
        position: absolute;
        background-color: #007acc;
        color: white;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        user-select: none;
        font-size: 13px;
        border: 1px solid #005999;
      }
      .dropped-component:hover {
        border-color: #55b3ff;
      }
      .dropped-component.selected {
        border: 2px solid #55b3ff;
        box-shadow: 0 0 10px rgba(85, 179, 255, 0.5);
      }

      /* Editor */
      #editor-container {
        flex: 1;
      }
      #editor {
        width: 100%;
        height: 100%;
      }

      /* Right Sidebar */
      #right-sidebar {
        width: 250px;
        min-width: 200px;
        background-color: #252526;
        border-left: 1px solid #2d2d2d;
        display: flex;
        flex-direction: column;
      }
      .panel-header {
        padding: 10px;
        font-size: 11px;
        text-transform: uppercase;
        color: #888;
        letter-spacing: 0.8px;
        border-bottom: 1px solid #2d2d2d;
        background-color: #252526;
      }
      .panel-content {
        padding: 10px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .panel-content p {
        color: rgba(204, 204, 204, 0.5);
        font-size: 12px;
        text-align: center;
        margin: 0;
      }
    </style>

    <!-- Load React, ReactDOM, and Babel -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;
      const fs = require('fs');
      const path = require('path');

      // --- Monaco Editor Global Setup ---
      const amdLoader = require('monaco-editor/min/vs/loader.js');
      const amdRequire = amdLoader.require;
      function uriFromPath(_path) {
        let pathName = path.resolve(_path).replace(/\\/g, '/');
        if (pathName.length > 0 && pathName.charAt(0) !== '/')
          pathName = '/' + pathName;
        return encodeURI('file://' + pathName);
      }
      amdRequire.config({
        baseUrl: uriFromPath(
          path.join(__dirname, 'node_modules/monaco-editor/min')
        ),
      });
      self.module = undefined;
      window.amdRequire = amdRequire; // Делаем доступным для React

      // --- Utility Code Gen ---
      function generateCppFromUI(components, className) {
        let code = `// GENERATED CODE - DO NOT MODIFY COMMENTS\n#pragma once\n\n#include "apf/PluginProcessor.h"\n\nclass ${className}UI {\npublic:\n    void setup() {\n`;
        components.forEach((comp) => {
          const x = parseInt(comp.left) || 0,
            y = parseInt(comp.top) || 0;
          const safeId = comp.id.replace(/[^a-zA-Z0-9_]/g, '');
          code += `        // COMPONENT: ${comp.id} | TYPE: ${comp.type}\n        ${safeId}.setBounds(${x}, ${y}, 100, 40);\n`;
        });
        code += `    }\n\nprivate:\n`;
        components.forEach((comp) => {
          const safeId = comp.id.replace(/[^a-zA-Z0-9_]/g, '');
          code += `        apf::${comp.type} ${safeId};\n`;
        });
        code += `};\n`;
        return code;
      }

      function parseUIFromCpp(cppCode) {
        const components = [];
        const lines = cppCode.split('\n');
        let currentId = null,
          currentType = null;
        for (let line of lines) {
          const commentMatch = line.match(
            /\/\/\s*COMPONENT:\s*(.*?)\s*\|\s*TYPE:\s*(.*)/
          );
          if (commentMatch) {
            currentId = commentMatch[1];
            currentType = commentMatch[2];
            continue;
          }
          const boundsMatch = line.match(/\.setBounds\(\s*(\d+)\s*,\s*(\d+)/);
          if (boundsMatch && currentId) {
            components.push({
              id: currentId,
              type: currentType,
              left: boundsMatch[1] + 'px',
              top: boundsMatch[2] + 'px',
            });
            currentId = null;
          }
        }
        return components;
      }

      // --- React Components ---

      function FileNode({ itemPath, isDirectory, name, onOpenFile }) {
        const [isOpen, setIsOpen] = useState(false);
        const [children, setChildren] = useState([]);

        const handleClick = (e) => {
          e.stopPropagation();
          if (isDirectory) {
            if (!isOpen) {
              try {
                const items = fs
                  .readdirSync(itemPath, { withFileTypes: true })
                  .filter(
                    (i) =>
                      !['node_modules', 'build'].includes(i.name) &&
                      !i.name.startsWith('.')
                  )
                  .sort((a, b) => {
                    if (a.isDirectory() && !b.isDirectory()) return -1;
                    if (!a.isDirectory() && b.isDirectory()) return 1;
                    return a.name.localeCompare(b.name);
                  });
                setChildren(items);
              } catch (err) {
                console.error(err);
              }
            }
            setIsOpen(!isOpen);
          } else {
            onOpenFile(itemPath);
          }
        };

        return (
          <div>
            <div
              className={`file-tree-item ${isDirectory ? 'folder' : 'file'}`}
              onClick={handleClick}
            >
              {isDirectory ? (isOpen ? '📂 ' : '📁 ') : '📄 '} {name}
            </div>
            {isOpen && isDirectory && (
              <div style={{ paddingLeft: '10px' }}>
                {children.map((child) => (
                  <FileNode
                    key={child.name}
                    itemPath={path.join(itemPath, child.name)}
                    isDirectory={child.isDirectory()}
                    name={child.name}
                    onOpenFile={onOpenFile}
                  />
                ))}
              </div>
            )}
          </div>
        );
      }

      function CodeEditor({ filePath, onDirty, onSaveRef }) {
        const editorContainer = useRef(null);
        const editorInstance = useRef(null);

        useEffect(() => {
          if (!editorContainer.current) return;
          let content = '';
          try {
            content = fs.readFileSync(filePath, 'utf-8');
          } catch (e) {}

          const ext = path.extname(filePath).toLowerCase();
          const lang =
            ext === '.cpp' || ext === '.h'
              ? 'cpp'
              : ext === '.json'
                ? 'json'
                : 'plaintext';

          window.amdRequire(['vs/editor/editor.main'], function () {
            editorInstance.current = monaco.editor.create(
              editorContainer.current,
              {
                value: content,
                language: lang,
                theme: 'vs-dark',
                automaticLayout: true,
              }
            );
            editorInstance.current.onDidChangeModelContent(() => onDirty(true));
          });

          return () => {
            if (editorInstance.current) editorInstance.current.dispose();
          };
        }, [filePath]);

        useEffect(() => {
          onSaveRef.current = () => {
            if (editorInstance.current) {
              const val = editorInstance.current.getValue();
              fs.writeFileSync(filePath, val, 'utf-8');
              onDirty(false);
              return val;
            }
            return null;
          };
        }, [filePath, onDirty]);

        return (
          <div
            ref={editorContainer}
            style={{ width: '100%', height: '100%' }}
          />
        );
      }

      function UIDesigner({ filePath, onDirty, onSaveRef, onSelectComponent }) {
        const [components, setComponents] = useState([]);
        const containerRef = useRef(null);

        useEffect(() => {
          try {
            if (fs.existsSync(filePath)) {
              const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
              if (data && data.components) setComponents(data.components);
            }
          } catch (e) {}
        }, [filePath]);

        useEffect(() => {
          onSaveRef.current = () => {
            fs.writeFileSync(
              filePath,
              JSON.stringify({ components }, null, 4),
              'utf-8'
            );
            onDirty(false);
            return components;
          };
        }, [filePath, components, onDirty]);

        const handleDrop = (e) => {
          e.preventDefault();
          const type = e.dataTransfer.getData('text/plain');
          if (!type) return;
          const rect = containerRef.current.getBoundingClientRect();
          const newComp = {
            id: `${type}_${Date.now()}`,
            type,
            left: e.clientX - rect.left - 40 + 'px',
            top: e.clientY - rect.top - 20 + 'px',
          };
          setComponents((prev) => [...prev, newComp]);
          onSelectComponent(newComp);
          onDirty(true);
        };

        const handleMouseDown = (e, comp) => {
          e.stopPropagation();
          onSelectComponent(comp);
          const el = e.currentTarget;
          const startX = e.clientX - el.getBoundingClientRect().left;
          const startY = e.clientY - el.getBoundingClientRect().top;

          const onMouseMove = (moveEvent) => {
            const rect = containerRef.current.getBoundingClientRect();
            const newLeft = moveEvent.clientX - startX - rect.left + 'px';
            const newTop = moveEvent.clientY - startY - rect.top + 'px';

            setComponents((prev) => {
              const next = prev.map((c) =>
                c.id === comp.id ? { ...c, left: newLeft, top: newTop } : c
              );
              onSelectComponent(next.find((c) => c.id === comp.id));
              return next;
            });
            onDirty(true);
          };

          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        };

        return (
          <div
            id="plugin-container"
            ref={containerRef}
            onDrop={handleDrop}
            onDragOver={(e) => e.preventDefault()}
          >
            {components.map((comp) => (
              <div
                key={comp.id}
                id={comp.id}
                className="dropped-component"
                style={{ left: comp.left, top: comp.top }}
                onMouseDown={(e) => handleMouseDown(e, comp)}
              >
                {comp.type}
              </div>
            ))}
          </div>
        );
      }

      function App() {
        const [tabs, setTabs] = useState([]); // Структура вкладок
        const [activeTabPath, setActiveTabPath] = useState(null);
        const [selectedComponent, setSelectedComponent] = useState(null);
        const [toast, setToast] = useState(null);

        const [projectRoot] = useState(() => path.join(__dirname, '..'));
        const [rootDirs, setRootDirs] = useState([]);

        const saveHandlers = useRef({}); // Храним методы сохранения для открытых файлов

        useEffect(() => {
          try {
            const items = fs
              .readdirSync(projectRoot, { withFileTypes: true })
              .filter(
                (i) =>
                  !['node_modules', 'build'].includes(i.name) &&
                  !i.name.startsWith('.')
              );
            setRootDirs(items);
          } catch (err) {}
        }, [projectRoot]);

        const showToast = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(null), 2000);
        };

        const openFile = (filePath) => {
          const isUIDesigner = filePath.endsWith('.ui');
          if (!tabs.find((t) => t.path === filePath)) {
            setTabs((prev) => [
              ...prev,
              {
                id: `tab_${Date.now()}`,
                path: filePath,
                type: isUIDesigner ? 'ui' : 'code',
                isDirty: false,
              },
            ]);
          }
          setActiveTabPath(filePath);
          setSelectedComponent(null);
        };

        const closeTab = (e, filePath) => {
          e.stopPropagation();
          setTabs((prev) => {
            const newTabs = prev.filter((t) => t.path !== filePath);
            if (activeTabPath === filePath) {
              setActiveTabPath(
                newTabs.length > 0 ? newTabs[newTabs.length - 1].path : null
              );
            }
            return newTabs;
          });
          delete saveHandlers.current[filePath];
        };

        const handleSave = useCallback(() => {
          if (!activeTabPath || !saveHandlers.current[activeTabPath]) return;

          const tab = tabs.find((t) => t.path === activeTabPath);
          const data = saveHandlers.current[activeTabPath]();

          const baseDir = path.dirname(activeTabPath);
          const baseName = path.basename(
            activeTabPath,
            path.extname(activeTabPath)
          );

          if (tab.type === 'ui') {
            const cppPath = path.join(baseDir, baseName + '.h');
            const cppCode = generateCppFromUI(data, baseName);
            fs.writeFileSync(cppPath, cppCode, 'utf-8');
          } else if (activeTabPath.endsWith('.h')) {
            const uiPath = path.join(baseDir, baseName + '.ui');
            if (fs.existsSync(uiPath)) {
              const comps = parseUIFromCpp(data);
              if (comps && comps.length > 0) {
                fs.writeFileSync(
                  uiPath,
                  JSON.stringify({ components: comps }, null, 4),
                  'utf-8'
                );
              }
            }
          }
          showToast(`Saved ${path.basename(activeTabPath)}`);
        }, [activeTabPath, tabs]);

        useEffect(() => {
          const onKeyDown = (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
              e.preventDefault();
              handleSave();
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [handleSave]);

        const activeTab = tabs.find((t) => t.path === activeTabPath);

        return (
          <>
            <div id="left-sidebar">
              <div id="file-explorer">
                <h3 className="section-header">Explorer</h3>
                <div id="file-tree">
                  {rootDirs.map((child) => (
                    <FileNode
                      key={child.name}
                      itemPath={path.join(projectRoot, child.name)}
                      isDirectory={child.isDirectory()}
                      name={child.name}
                      onOpenFile={openFile}
                    />
                  ))}
                </div>
              </div>
              <div id="toolbox">
                <h3 className="section-header">Components</h3>
                <div
                  className="component"
                  draggable
                  onDragStart={(e) =>
                    e.dataTransfer.setData('text/plain', 'Knob')
                  }
                >
                  Dial / Knob
                </div>
                <div
                  className="component"
                  draggable
                  onDragStart={(e) =>
                    e.dataTransfer.setData('text/plain', 'Slider')
                  }
                >
                  Fader / Slider
                </div>
                <div
                  className="component"
                  draggable
                  onDragStart={(e) =>
                    e.dataTransfer.setData('text/plain', 'Button')
                  }
                >
                  Toggle Button
                </div>
              </div>
            </div>

            <div id="center-panel">
              <div id="tabs">
                {tabs.map((tab) => (
                  <button
                    key={tab.path}
                    className={`tab-btn ${activeTabPath === tab.path ? 'active' : ''}`}
                    onClick={() => setActiveTabPath(tab.path)}
                  >
                    {path.basename(tab.path)} {tab.isDirty && '*'}
                    <span
                      className="close-tab-btn"
                      onClick={(e) => closeTab(e, tab.path)}
                    >
                      &times;
                    </span>
                  </button>
                ))}
              </div>
              <div id="tab-content">
                {activeTab ? (
                  activeTab.type === 'ui' ? (
                    <div
                      id="canvas"
                      className="tab-pane active"
                      style={{ display: 'flex' }}
                    >
                      <UIDesigner
                        filePath={activeTab.path}
                        onDirty={(d) =>
                          setTabs((prev) =>
                            prev.map((t) =>
                              t.path === activeTab.path
                                ? { ...t, isDirty: d }
                                : t
                            )
                          )
                        }
                        onSaveRef={{
                          current: (fn) =>
                            (saveHandlers.current[activeTab.path] = fn),
                        }}
                        onSelectComponent={setSelectedComponent}
                      />
                    </div>
                  ) : (
                    <div
                      id="editor-container"
                      className="tab-pane active"
                      style={{ display: 'flex' }}
                    >
                      <CodeEditor
                        filePath={activeTab.path}
                        onDirty={(d) =>
                          setTabs((prev) =>
                            prev.map((t) =>
                              t.path === activeTab.path
                                ? { ...t, isDirty: d }
                                : t
                            )
                          )
                        }
                        onSaveRef={{
                          current: (fn) =>
                            (saveHandlers.current[activeTab.path] = fn),
                        }}
                      />
                    </div>
                  )
                ) : (
                  <div
                    style={{
                      flex: 1,
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      color: '#555',
                    }}
                  >
                    Open a file from the explorer
                  </div>
                )}
              </div>
            </div>

            <div id="right-sidebar">
              <div className="panel-header">Properties / Inspector</div>
              <div className="panel-content">
                {selectedComponent ? (
                  <div
                    style={{
                      width: '100%',
                      textAlign: 'left',
                      fontSize: '12px',
                    }}
                  >
                    <p style={{ marginBottom: '10px' }}>
                      <strong>ID:</strong> {selectedComponent.id}
                    </p>
                    <p style={{ marginBottom: '10px' }}>
                      <strong>Type:</strong> {selectedComponent.type}
                    </p>
                    <p style={{ marginBottom: '10px' }}>
                      <strong>Left:</strong> {selectedComponent.left}
                    </p>
                    <p style={{ marginBottom: '10px' }}>
                      <strong>Top:</strong> {selectedComponent.top}
                    </p>
                  </div>
                ) : (
                  <p>Select a component to view properties</p>
                )}
              </div>
            </div>

            {toast && (
              <div
                style={{
                  position: 'absolute',
                  bottom: 20,
                  right: 20,
                  backgroundColor: '#007acc',
                  color: 'white',
                  padding: '8px 16px',
                  borderRadius: '4px',
                  zIndex: 1000,
                  boxShadow: '0 2px 8px rgba(0,0,0,0.5)',
                }}
              >
                {toast}
              </div>
            )}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
