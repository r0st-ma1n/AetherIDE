name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Job names below are referenced by branch protection on `main`; rename with care.
jobs:
  ide:
    name: IDE (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  cpp-format:
    name: C++ format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install -r requirements-dev.txt

      - name: Check C++ formatting
        run: make cpp-format-check

  cpp:
    name: C++ build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build targets
        run: cmake --build build --config Release

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

      # The sample as a standalone project: FetchContent takes the framework from this
      # checkout, the way the IDE builds user projects.
      - name: Configure GainPlugin sample standalone
        run: cmake -S samples/GainPlugin -B build-sample "-DFETCHCONTENT_SOURCE_DIR_AETHER=${{ github.workspace }}"

      - name: Build GainPlugin sample standalone
        run: cmake --build build-sample --config Release

      - name: Test GainPlugin sample standalone
        run: ctest --test-dir build-sample -C Release --output-on-failure
